<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seccom Net | Catálogo de productos</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <div id="site-header"></div>

  <section class="hero">
    <div class="container">
      <h1>Catálogo de productos</h1>
      <div class="buscador">
        <input type="search" id="buscador" placeholder="Buscar por nombre, marca o modelo..." autocomplete="off">
        <select id="selectCategoria" aria-label="Categoría"></select>
        <button type="button" id="btnLimpiar" class="btn-limpiar">Limpiar</button>
      </div>
    </div>
  </section>

  <main class="container" id="catalogo">
    <div class="filtros" id="filtros"></div>
    <p class="resultados" id="resultados"></p>
    <div class="grid" id="grid"></div>
    <p class="vacio" id="vacio" hidden>No encontramos productos con esa búsqueda.</p>
  </main>

  <div id="site-footer"></div>

  <script src="js/productos.js?v=4"></script>
  <script src="js/layout.js?v=4"></script>
  <script src="js/catalogo.js?v=4"></script>
</body>
</html>
